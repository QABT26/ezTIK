name: ezTIK Android gate

on:
  push:
    branches: [main, feat/eztik-android-foundation-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node guest gateway tests
        run: node --test backend/tiktok/feed-gateway.test.js
      - name: Ensure Android SDK 35
        run: |
          test -n "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android unit tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
